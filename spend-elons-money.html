  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; }

  .header {
    background: linear-gradient(135deg, #2ecc71, #1abc9c);
    text-align: center; padding: 1.2rem 1rem 1rem;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .header h1 { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.95); margin-bottom: 0.3rem; letter-spacing: 0.3px; }
  .money-display { font-size: 38px; font-weight: 800; color: #fff; letter-spacing: -1.5px; font-variant-numeric: tabular-nums; }
  .money-display.low { color: #ffe066; }
  .money-display.empty { color: #ff6b6b; }
  .money-bar-wrap { width: 90%; max-width: 420px; margin: 0.6rem auto 0; height: 7px; background: rgba(255,255,255,0.3); border-radius: 99px; overflow: hidden; }
  .money-bar { height: 100%; background: #fff; border-radius: 99px; transition: width 0.4s ease; }

  .items-list { max-width: 500px; margin: 0 auto; }
  .item-row {
    display: flex; flex-direction: column; align-items: center;
    padding: 2.2rem 1.5rem 1.8rem; border-bottom: 10px solid #f5f5f5;
    background: #fff;
  }
  .item-img-wrap {
    width: 100%; height: 200px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 1.2rem; overflow: hidden; border-radius: 4px;
  }
  .item-img {
    width: 100%; height: 200px;
    object-fit: cover; object-position: center;
    border-radius: 4px;
    transition: transform 0.3s ease;
  }
  .item-row:hover .item-img { transform: scale(1.02); }
  .item-emoji-fallback { font-size: 90px; line-height: 1; display: none; }

  .item-name { font-size: 24px; font-weight: 700; color: #111; text-align: center; margin-bottom: 0.3rem; }
  .item-price { font-size: 22px; font-weight: 600; color: #2ecc71; margin-bottom: 1.3rem; }

  .btns { display: flex; width: 100%; max-width: 380px; border-radius: 8px; overflow: hidden; border: 1.5px solid #ddd; }
  .btn-sell { flex: 1; padding: 15px 0; font-size: 17px; font-weight: 600; border: none; cursor: pointer; background: #f0f0f0; color: #444; transition: background 0.15s; }
  .btn-sell:hover:not(:disabled) { background: #e0e0e0; }
  .btn-count { flex: 1; padding: 15px 0; font-size: 19px; font-weight: 700; border: none; border-left: 1.5px solid #ddd; border-right: 1.5px solid #ddd; background: #fff; color: #111; text-align: center; pointer-events: none; }
  .btn-buy { flex: 1; padding: 15px 0; font-size: 17px; font-weight: 600; border: none; cursor: pointer; background: #2ecc71; color: #fff; transition: background 0.15s; }
  .btn-buy:hover:not(:disabled) { background: #27ae60; }
  .btn-buy:active:not(:disabled) { transform: scale(0.97); }
  .btn-buy:disabled, .btn-sell:disabled { opacity: 0.3; cursor: not-allowed; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(70px); background: #111; color: #fff; border-radius: 30px; padding: 10px 22px; font-size: 14px; font-weight: 500; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .win-msg { text-align: center; padding: 3rem 1rem; font-size: 26px; font-weight: 700; color: #2ecc71; display: none; }
  .win-msg.visible { display: block; }
  .win-msg p { font-size: 15px; color: #888; font-weight: 400; margin-top: 0.5rem; }
  footer { text-align: center; padding: 2rem; font-size: 12px; color: #bbb; }

items.sort((a, b) => a.price - b.price);

function fmt(n) {
  if (n >= 1e12) return "$" + (n/1e12).toFixed(n%1e12===0?0:2) + "T";
  if (n >= 1e9) return "$" + (n/1e9).toFixed(n%1e9===0?0:1) + "B";
  if (n >= 1e6) return "$" + (n/1e6).toFixed(n%1e6===0?0:1) + "M";
  return "$" + n.toLocaleString();
}
function fmtFull(n) { return "$" + Math.round(n).toLocaleString(); }

let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

function updateUI() {
  const d = document.getElementById("money-display");
  d.textContent = fmtFull(balance);
  if (balance <= 0) d.className = "money-display empty";
  else if (balance < TOTAL * 0.1) d.className = "money-display low";
  else d.className = "money-display";

  const pct = Math.max(0, balance / TOTAL * 100);
  document.getElementById("money-bar").style.width = pct + "%";

  items.forEach((it, i) => {
    const c = counts[i] || 0;
    const ce = document.getElementById("count-" + i);
    const bb = document.getElementById("buy-" + i);
    const sb = document.getElementById("sell-" + i);
    if (ce) ce.textContent = c;
    if (bb) bb.disabled = balance < it.price;
    if (sb) sb.disabled = c === 0;
  });
  document.getElementById("win-msg").className = "win-msg" + (balance <= 0 ? " visible" : "");
}

function buy(i) {
  if (balance >= items[i].price) {
    balance -= items[i].price;
    counts[i] = (counts[i] || 0) + 1;
    updateUI();
  } else { showToast("Paisa nahi hai! 💸"); }
}
function sell(i) {
  if ((counts[i] || 0) > 0) {
    balance = Math.min(TOTAL, balance + items[i].price);
    counts[i]--;
    updateUI();
  }
}

const list = document.getElementById("items-list");
items.forEach((it, i) => {
  counts[i] = 0;
  const row = document.createElement("div");
  row.className = "item-row";
  row.innerHTML = `
    <div class="item-img-wrap">
      <img class="item-img" src="${it.img}" alt="${it.name}" loading="lazy"
        onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <div class="item-emoji-fallback">${it.emoji}</div>
    </div>
    <div class="item-name">${it.name}</div>
    <div class="item-price">${fmt(it.price)}</div>
    <div class="btns">
      <button class="btn-sell" id="sell-${i}" onclick="sell(${i})" disabled>Sell</button>
      <div class="btn-count" id="count-${i}">0</div>
      <button class="btn-buy" id="buy-${i}" onclick="buy(${i})">Buy</button>
    </div>
  `;
  list.appendChild(row);
});

updateUI();
